<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐰</text></svg>" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#FF9AAE" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="StudyBun" />
    <meta name="description" content="Your cozy JEE study companion — study tracking, planning, revision, and AI insights." />
    <!-- Fonts moved here from a JS-injected <style>@import so the browser's
         HTML preloader can discover + start fetching them immediately,
         instead of waiting for the JS bundle to download, parse, execute,
         and render before the @import inside GlobalStyle is even seen.
         preconnect warms the connection. The stylesheet itself uses the
         classic preload+swap trick: `rel="preload" as="style"` fetches it
         with high priority WITHOUT blocking rendering, then the
         onload flips it to a real stylesheet the instant it lands. Text
         paints immediately in a fallback font (font-display: swap in the
         Google Fonts CSS) and reflows to Baloo/Nunito/Caveat once ready --
         a plain <link rel="stylesheet"> here would otherwise sit in the
         render-blocking path for however long that request takes. <noscript>
         covers the (rare) no-JS case. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;600;700;800&family=Caveat:wght@600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;600;700;800&family=Caveat:wght@600;700&display=swap"
      />
    </noscript>
    <title>StudyBun · Your Cozy JEE Study Companion</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
